<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive network map of Roy Cooper's political relationships relevant to foreign aid advocacy.">
<meta property="og:title" content="Roy Cooper's Relationship Network">
<meta property="og:description" content="48 documented relationships — allies, persuadable bridges, and cross-party ties for CARE USA foreign aid advocacy.">
<meta property="og:type" content="website">
<title>Roy Cooper's Relationship Network</title>
<style>
/* =========================================================
   BASE / RESET
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #0a0e27;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
}
/* Focus outlines for accessibility */
:focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }

/* =========================================================
   LAYOUT SHELL
   ========================================================= */
#app { position: relative; width: 100%; height: 100%; }
#graph-container { position: absolute; inset: 0; }

/* =========================================================
   TAB BAR
   ========================================================= */
#tab-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 44px;
  background: rgba(10,14,39,0.92);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  padding: 0 12px;
  z-index: 100;
  gap: 4px;
}
.tab-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  padding: 0 16px;
  height: 36px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s, color 0.15s;
  min-width: 44px;
}
.tab-btn:hover { background: rgba(255,255,255,0.07); color: #e2e8f0; }
.tab-btn.active { background: rgba(59,130,246,0.2); color: #60a5fa; }

/* hamburger – mobile only */
#hamburger-btn {
  display: none;
  background: transparent;
  border: none;
  color: #e2e8f0;
  cursor: pointer;
  font-size: 20px;
  width: 44px;
  height: 44px;
  align-items: center;
  justify-content: center;
  margin-left: auto;
}

/* =========================================================
   HINT BANNER
   ========================================================= */
#hint-banner {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30,41,59,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 12px;
  color: #cbd5e1;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 90;
  white-space: nowrap;
  max-width: 90vw;
  white-space: normal;
  text-align: center;
}
#hint-banner button {
  background: none;
  border: none;
  color: #94a3b8;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  flex-shrink: 0;
  padding: 2px 4px;
  min-width: 24px;
}

/* =========================================================
   3D/2D TOGGLE
   ========================================================= */
#dim-toggle {
  position: absolute;
  top: 54px;
  right: 12px;
  background: rgba(30,41,59,0.9);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  color: #e2e8f0;
  cursor: pointer;
  padding: 8px 14px;
  font-size: 12px;
  z-index: 90;
  transition: background 0.15s;
}
#dim-toggle:hover { background: rgba(59,130,246,0.25); }

/* =========================================================
   FILTERS PANEL
   ========================================================= */
#filters-panel {
  position: absolute;
  top: 50px;
  left: 8px;
  width: 240px;
  background: rgba(10,14,39,0.95);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 12px;
  z-index: 80;
  max-height: calc(100vh - 70px);
  overflow-y: auto;
}
.filters-section { margin-bottom: 14px; }
.filters-section label.section-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748b;
  margin-bottom: 6px;
}
.radio-group, .check-group { display: flex; flex-direction: column; gap: 4px; }
.radio-group label, .check-group label {
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  font-size: 13px;
  color: #cbd5e1;
  min-height: 28px;
}
input[type="radio"], input[type="checkbox"] {
  accent-color: #3b82f6;
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}
.chip-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.chip-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
/* slider */
#score-slider {
  width: 100%;
  accent-color: #3b82f6;
  margin-top: 4px;
}
#slider-val {
  font-size: 11px;
  color: #94a3b8;
  margin-left: 4px;
}
/* search */
#search-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: #e2e8f0;
  padding: 7px 10px;
  font-size: 13px;
  outline: none;
}
#search-input:focus { border-color: #3b82f6; }
#search-dropdown {
  position: absolute;
  left: 12px;
  right: 12px;
  background: #1e293b;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  overflow: hidden;
  z-index: 200;
  display: none;
}
#search-dropdown .dd-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
  color: #e2e8f0;
}
#search-dropdown .dd-item:hover { background: rgba(59,130,246,0.2); }
/* reset btn */
#reset-btn {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: #94a3b8;
  cursor: pointer;
  padding: 7px;
  font-size: 12px;
  transition: background 0.15s;
}
#reset-btn:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
/* count line */
#count-line {
  font-size: 11px;
  color: #64748b;
  margin-top: 8px;
  text-align: center;
}
#empty-state {
  display: none;
  font-size: 11px;
  color: #ef4444;
  text-align: center;
  margin-top: 4px;
}

/* =========================================================
   START HERE PANEL
   ========================================================= */
#start-panel {
  position: absolute;
  bottom: 16px;
  left: 256px;
  width: 420px;
  background: rgba(10,14,39,0.97);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 16px;
  z-index: 85;
  max-height: 50vh;
  overflow-y: auto;
}
#start-panel h2 {
  font-size: 14px;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 4px;
}
#start-panel .sub {
  font-size: 11px;
  color: #64748b;
  margin-bottom: 12px;
}
#start-panel .close-btn {
  position: absolute;
  top: 10px;
  right: 12px;
  background: none;
  border: none;
  color: #64748b;
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 4px;
  min-width: 28px;
  min-height: 28px;
}
#start-panel .close-btn:hover { color: #e2e8f0; }
.start-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.start-col h3 {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.col-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.start-entry {
  display: block;
  width: 100%;
  text-align: left;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 6px;
  padding: 7px 9px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: background 0.15s;
}
.start-entry:hover { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.3); }
.start-entry .en { font-size: 13px; font-weight: 600; color: #f1f5f9; }
.start-entry .er { font-size: 10px; color: #94a3b8; margin-top: 1px; }
.start-entry .es { font-size: 10px; color: #64748b; }

/* =========================================================
   SIDEBAR
   ========================================================= */
#sidebar {
  position: absolute;
  top: 44px;
  right: 0;
  width: 340px;
  height: calc(100% - 44px);
  background: rgba(10,14,39,0.97);
  border-left: 1px solid rgba(255,255,255,0.08);
  overflow-y: auto;
  z-index: 90;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  padding: 16px;
}
#sidebar.open { transform: translateX(0); }
#sidebar-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  color: #64748b;
  cursor: pointer;
  font-size: 20px;
  line-height: 1;
  padding: 4px;
  min-width: 32px;
  min-height: 32px;
}
#sidebar-close:hover { color: #e2e8f0; }
#sidebar h2 {
  font-size: 16px;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 4px;
  padding-right: 36px;
}
.sb-type-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 10px;
}
.sb-meta { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
.sb-meta strong { color: #cbd5e1; }
.sb-section-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #64748b;
  margin: 14px 0 6px;
}
.sb-edge {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}
.sb-edge .cat-chip {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.sb-edge .detail { font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
.sb-edge .period { font-size: 11px; color: #64748b; margin-bottom: 4px; }
.sb-edge .evidence { font-size: 11px; color: #94a3b8; margin-bottom: 4px; font-style: italic; }
.sb-edge .score { font-size: 11px; color: #64748b; }
.sb-edge a {
  display: block;
  font-size: 11px;
  color: #60a5fa;
  word-break: break-all;
  margin-top: 4px;
}
.sb-edge a:hover { text-decoration: underline; }

/* =========================================================
   SOURCES TAB VIEW
   ========================================================= */
#sources-view {
  display: none;
  position: absolute;
  top: 44px;
  left: 0;
  right: 0;
  bottom: 0;
  overflow-y: auto;
  padding: 16px;
  z-index: 70;
  background: #0a0e27;
}
#sources-view h2 {
  font-size: 16px;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 4px;
}
#dl-link {
  display: inline-block;
  margin-bottom: 14px;
  font-size: 12px;
  color: #60a5fa;
  text-decoration: none;
}
#dl-link:hover { text-decoration: underline; }
#sources-table-wrap { overflow-x: auto; }
#sources-table {
  border-collapse: collapse;
  width: 100%;
  min-width: 700px;
  font-size: 12px;
}
#sources-table th {
  background: rgba(255,255,255,0.05);
  color: #94a3b8;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 8px 10px;
  text-align: left;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
#sources-table th:hover { background: rgba(255,255,255,0.09); color: #e2e8f0; }
#sources-table th.sorted { color: #60a5fa; }
#sources-table th .sort-arrow { margin-left: 4px; opacity: 0.5; }
#sources-table th.sorted .sort-arrow { opacity: 1; }
#sources-table td {
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: #cbd5e1;
  vertical-align: top;
}
#sources-table tr:hover td { background: rgba(255,255,255,0.03); }
#sources-table a { color: #60a5fa; word-break: break-all; }
#sources-table a:hover { text-decoration: underline; }

/* =========================================================
   MOBILE OVERRIDES
   ========================================================= */
@media (max-width: 600px) {
  #hamburger-btn { display: flex; }
  #filters-panel {
    position: fixed;
    top: 44px;
    left: 0;
    width: 100%;
    border-radius: 0;
    max-height: 70vh;
    display: none;
    z-index: 200;
  }
  #filters-panel.mobile-open { display: block; }
  #start-panel {
    left: 8px;
    right: 8px;
    width: auto;
    bottom: 10px;
    max-height: 55vh;
  }
  #sidebar {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 60vh;
    border-left: none;
    border-top: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px 12px 0 0;
    transform: translateY(100%);
  }
  #sidebar.open { transform: translateY(0); }
  #dim-toggle { top: 54px; right: 8px; }
  #sources-view { padding: 10px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- GRAPH CANVAS -->
  <div id="graph-container"></div>

  <!-- TAB BAR -->
  <div id="tab-bar" role="tablist">
    <button class="tab-btn active" id="tab-map" role="tab" aria-selected="true" aria-controls="graph-container">Map</button>
    <button class="tab-btn" id="tab-sources" role="tab" aria-selected="false" aria-controls="sources-view">Sources</button>
    <button id="hamburger-btn" aria-label="Toggle filters" aria-expanded="false">☰</button>
  </div>

  <!-- HINT BANNER -->
  <div id="hint-banner" role="alert" aria-live="polite">

  <!-- 3D/2D TOGGLE -->
  <button id="dim-toggle" aria-label="Toggle 3D/2D view">Switch to 2D</button>

  <!-- FILTERS PANEL -->
  <aside id="filters-panel" aria-label="Filters">
    <div style="position:relative;">
      <div class="filters-section">
        <label class="section-label">Group</label>
        <div class="radio-group">
          <label><input type="radio" name="group" value="all" checked> All</label>

          <label><input type="radio" name="group" value="bridges"> Bridges only</label>
        </div>
      </div>

      <div class="filters-section">

            <span class="chip-label"><span class="chip-dot" style="background:#3b82f6"></span>Legislative/Governing</span>

          <label>

            <span class="chip-label"><span class="chip-dot" style="background:#10b981"></span>Business Recruitment</span>
          </label>
          <label>
            <input type="checkbox" class="rel-check" value="campaign/endorsement" checked>
            <span class="chip-label"><span class="chip-dot" style="background:#a855f7"></span>Campaign/Endorsement</span>
          </label>
          <label>
            <input type="checkbox" class="rel-check" value="professional" checked>
            <span class="chip-label"><span class="chip-dot" style="background:#f97316"></span>Professional</span>
          </label>
        </div>
      </div>

      <div class="filters-section">
        <label class="section-label">Min Influence Score <span id="slider-val">1.0</span></label>
        <input type="range" id="score-slider" min="1.0" max="5.0" step="0.5" value="1.0" aria-label="Minimum influence score">
      </div>

      <div class="filters-section" style="position:relative;">
        <label class="section-label">Search</label>
        <input type="text" id="search-input" placeholder="Node name…" autocomplete="off" aria-label="Search nodes">
        <div id="search-dropdown" role="listbox"></div>
      </div>

      <button id="reset-btn" aria-label="Reset all filters">Reset filters</button>
      <div id="count-line">Loading…</div>
      <div id="empty-state" role="status">No results. Try resetting filters.</div>
    </div>
  </aside>

  <!-- START HERE PANEL -->
  <div id="start-panel" role="complementary" aria-label="Start Here: Allies and Bridges">
    <button class="close-btn" aria-label="Close Start Here panel" onclick="closeStartPanel()">×</button>
    <h2>Start Here</h2>
    <p class="sub">Key contacts for foreign aid advocacy</p>
    <div class="start-cols">
      <div class="start-col">
        <h3><span class="col-dot" style="background:#22d3ee"></span> Allies</h3>
        <div id="allies-list"></div>
      </div>
      <div class="start-col">
        <h3><span class="col-dot" style="background:#eab308"></span> Bridges</h3>
        <div id="bridges-list"></div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside id="sidebar" role="complementary" aria-label="Node / Edge details" aria-hidden="true">
    <button id="sidebar-close" aria-label="Close sidebar">×</button>
    <div id="sidebar-content"></div>
  </aside>

  <!-- SOURCES VIEW -->
  <div id="sources-view" role="main" aria-label="Sources table">
    <h2>All Relationships</h2>
    <a id="dl-link" href="relationships.csv" download>Download all data (CSV)</a>
    <div id="sources-table-wrap">
      <table id="sources-table" aria-label="Relationships table">
        <thead>
          <tr>
            <th data-col="node_b">Person <span class="sort-arrow">↕</span></th>
            <th data-col="node_b_type">Type <span class="sort-arrow">↕</span></th>
            <th data-col="relationship_type">Category <span class="sort-arrow">↕</span></th>
            <th data-col="period">Date <span class="sort-arrow">↕</span></th>
            <th data-col="evidence">Evidence <span class="sort-arrow">↕</span></th>
            <th data-col="influence_score">Score <span class="sort-arrow">↕</span></th>
            <th data-col="source_url">Source <span class="sort-arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="sources-tbody"></tbody>
      </table>
    </div>
  </div>

</div><!-- #app -->

  'disaster_response':     '#ef4444',
  'legislative/governing': '#3b82f6',
  'campaign/endorsement':  '#a855f7',
  'business_recruitment':  '#10b981',
  'professional':          '#f97316',
};

/* =========================================================
   CSV PARSER (RFC 4180 compliant enough)
   ========================================================= */
function parseCSV(text) {
  const rows = [];
  let inQuote = false, field = '', row = [], i = 0;
  const push = () => { row.push(field); field = ''; };
  while (i < text.length) {
    const c = text[i];
    if (inQuote) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i += 2; continue; }
        inQuote = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuote = true; }
      else if (c === ',') { push(); }
      else if (c === '\n') { push(); if (row.length > 1 || row[0]) rows.push(row); row = []; }
      else if (c === '\r') { /* skip */ }
      else { field += c; }
    }
    i++;
  }
  if (field || row.length) { push(); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text.trim());
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (r[i] || '').trim(); });
    return obj;
  });
}

/* =========================================================
   DATA PROCESSING
   ========================================================= */
let allEdges = [];
let nodeMap = new Map();   // name -> node data
let edgesByNode = new Map(); // name -> [edges]

function processData() {
  allEdges = csvToObjects(CSV_DATA);

  // Build node map
  nodeMap.clear();
  edgesByNode.clear();

  // Add Roy Cooper
  nodeMap.set('Roy Cooper', {
    id: 'Roy Cooper',
    type: 'candidate',
    is_sitting_member: 'False',
    is_nc_delegation: 'True',
    committee_assignments: '',
    term_status: '',
    maxScore: 5.0,
    notes: '',
    role: 'Governor of North Carolina (D), 2017-2025; U.S. Senate candidate 2026',
    isCooper: true,
  });
  edgesByNode.set('Roy Cooper', []);

  allEdges.forEach(e => {
    const b = e.node_b;
    if (!nodeMap.has(b)) {
      nodeMap.set(b, {
        id: b,
        type: e.node_b_type,
        is_sitting_member: e.is_sitting_member,
        is_nc_delegation: e.is_nc_delegation,
        committee_assignments: e.committee_assignments,
        term_status: e.term_status,
        maxScore: parseFloat(e.influence_score) || 0,
        notes: e.notes,
        role: ROLES[b] || e.node_b_type,
        isCooper: false,
      });
    } else {
      const n = nodeMap.get(b);
      n.maxScore = Math.max(n.maxScore, parseFloat(e.influence_score) || 0);
    }
    // Track edges per node
    if (!edgesByNode.has('Roy Cooper')) edgesByNode.set('Roy Cooper', []);
    if (!edgesByNode.has(b)) edgesByNode.set(b, []);
    edgesByNode.get('Roy Cooper').push(e);
    edgesByNode.get(b).push(e);
  });

  computeAlliesAndBridges();
}

/* =========================================================
   ALLIES / BRIDGES COMPUTATION
   ========================================================= */
let allies = [], bridges = [];

function computeAlliesAndBridges() {
  allies = []; bridges = [];
  nodeMap.forEach((node, name) => {
    if (name === 'Roy Cooper') return;
    if (ORGS_EXCLUDE.has(name)) return;
    if (FORMER_EXCLUDE.has(name)) return;

    // Check any positive valence edge
    const edges = edgesByNode.get(name) || [];
    const posEdges = edges.filter(e => e.relationship_valence === 'positive');
    if (!posEdges.length) return;

    // Compute cross_party and aid_stance from edges (max/any)
    const isCrossParty = posEdges.some(e => e.cross_party === 'True');
    const aidStances = posEdges.map(e => parseFloat(e.aid_stance)).filter(v => !isNaN(v));
    const maxAidStance = aidStances.length ? Math.max(...aidStances) : 0;

    // Bridge: cross_party OR aid_stance == 0.0
    if (isCrossParty || maxAidStance === 0.0) {
      bridges.push({ name, score: node.maxScore, role: node.role });
    } else if (maxAidStance >= 0.5) {
      allies.push({ name, score: node.maxScore, role: node.role });
    }
  });

  allies.sort((a, b) => b.score - a.score);
  bridges.sort((a, b) => b.score - a.score);
}

/* =========================================================
   FILTER STATE
   ========================================================= */
let filterState = {
  group: 'all',
  relTypes: new Set(['disaster_response','legislative/governing','business_recruitment','campaign/endorsement','professional']),
  minScore: 1.0,
  search: '',
};

/* =========================================================
   GRAPH
   ========================================================= */
let Graph = null;
let is3D = true;
let graphData = { nodes: [], links: [] };
let highlightNodes = new Set();
let highlightLinks = new Set();

function buildGlowSprite(color, size = 32) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const r = size / 2;
  const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
  grad.addColorStop(0, color + 'ff');
  grad.addColorStop(0.4, color + 'aa');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return canvas;
}

function nodeSize(node) {
  if (node.isCooper) return 18;
  return 5 + (node.maxScore || 1) * 2.2;
}

function getFilteredGraphData() {
  const visibleNodes = new Set();
  const visibleLinks = [];

  // Determine which nodes pass filters
  const allyNames = new Set(allies.map(a => a.name));
  const bridgeNames = new Set(bridges.map(b => b.name));

  allEdges.forEach(e => {
    const score = parseFloat(e.influence_score) || 0;
    if (score < filterState.minScore) return;
    if (!filterState.relTypes.has(e.relationship_type)) return;

    const name = e.node_b;
    // Group filter
    if (filterState.group === 'allies' && !allyNames.has(name)) return;
    if (filterState.group === 'bridges' && !bridgeNames.has(name)) return;

    // Search filter
    if (filterState.search) {
      const q = filterState.search.toLowerCase();
      if (!name.toLowerCase().includes(q)) return;
    }

    visibleNodes.add('Roy Cooper');
    visibleNodes.add(name);
    visibleLinks.push(e);
  });

  const nodes = [...visibleNodes].map(name => ({ ...nodeMap.get(name) }));
  const links = visibleLinks.map((e, idx) => ({
    source: e.node_a,
    target: e.node_b,
    relationship_type: e.relationship_type,
    relationship_valence: e.relationship_valence,
    relationship_detail: e.relationship_detail,
    period: e.period,
    evidence: e.evidence,
    influence_score: e.influence_score,
    source_url: e.source_url,
    _rawEdge: e,
    _idx: idx,
  }));

  return { nodes, links };
}

function initGraph() {
  const container = document.getElementById('graph-container');
  Graph = ForceGraph3D()(container)
    .backgroundColor('#0a0e27')
    .nodeId('id')
    .nodeLabel(n => `<span style="color:#f1f5f9;font-size:13px;background:rgba(10,14,39,0.9);padding:4px 8px;border-radius:6px;">${n.id}</span>`)
    .nodeThreeObject(node => {
      const color = NODE_COLORS[node.type] || '#94a3b8';
      const spriteMap = new THREE.CanvasTexture(buildGlowSprite(color, 64));
      const mat = new THREE.SpriteMaterial({ map: spriteMap, transparent: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      const s = nodeSize(node) * 1.6;
      sprite.scale.set(s, s, 1);

      // For sitting members: add white ring outline
      if (node.is_sitting_member === 'True' && !node.isCooper) {
        const ringGeo = new THREE.RingGeometry(nodeSize(node) * 0.5, nodeSize(node) * 0.65, 24);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        const group = new THREE.Group();
        group.add(sprite);
        group.add(ring);
        return group;
      }
      return sprite;
    })
    .nodeThreeObjectExtend(false)
    .linkColor(link => {
      if (link.relationship_valence === 'adversarial') return 'rgba(100,116,139,0.35)';
      const c = REL_COLORS[link.relationship_type] || '#94a3b8';
      return c + '66';
    })
    .linkWidth(link => highlightLinks.has(link) ? 2.5 : 1.0)
    .linkOpacity(0.5)
    .linkCurvature(0.25)
    .linkDirectionalParticles(0)
    .onNodeClick(node => openNodeSidebar(node))
    .onLinkClick(link => openEdgeSidebar(link))
    .onNodeHover(node => {
      highlightNodes.clear(); highlightLinks.clear();
      if (node) {
        highlightNodes.add(node);
        (edgesByNode.get(node.id) || []).forEach(e => {
          graphData.links.forEach(l => {
            if (l._rawEdge === e) highlightLinks.add(l);
          });
        });
      }
      container.style.cursor = node ? 'pointer' : 'default';
      Graph.linkColor(Graph.linkColor());
    })
    .onLinkHover(link => {
      highlightLinks.clear();
      if (link) highlightLinks.add(link);
      container.style.cursor = link ? 'pointer' : 'default';
      Graph.linkColor(Graph.linkColor());
    });

  // Pin Cooper at center after warm-up
  Graph.d3Force('charge').strength(-120);
  Graph.d3Force('link').distance(80);

  applyGraphData();
}

function applyGraphData() {
  graphData = getFilteredGraphData();
  Graph.graphData(graphData);

  // Pin Cooper
  setTimeout(() => {
    const cooperNode = graphData.nodes.find(n => n.id === 'Roy Cooper');
    if (cooperNode) { cooperNode.fx = 0; cooperNode.fy = 0; cooperNode.fz = 0; }
    updateCountLine(graphData);
  }, 50);
}

function updateCountLine(data) {
  const people = data.nodes.filter(n => n.id !== 'Roy Cooper').length;
  const rels = data.links.length;
  document.getElementById('count-line').textContent = `Showing ${people} people, ${rels} relationships`;
  document.getElementById('empty-state').style.display = people === 0 ? 'block' : 'none';
}

/* =========================================================
   FILTER WIRING
   ========================================================= */
function resetFilters() {
  filterState = {
    group: 'all',
    relTypes: new Set(['disaster_response','legislative/governing','business_recruitment','campaign/endorsement','professional']),
    minScore: 1.0,
    search: '',
  };
  document.querySelectorAll('input[name="group"]').forEach(r => { r.checked = r.value === 'all'; });
  document.querySelectorAll('.rel-check').forEach(c => { c.checked = true; });
  document.getElementById('score-slider').value = 1.0;
  document.getElementById('slider-val').textContent = '1.0';
  document.getElementById('search-input').value = '';
  document.getElementById('search-dropdown').style.display = 'none';
  applyGraphData();
}

function wireFilters() {
  // Group radio
  document.querySelectorAll('input[name="group"]').forEach(r => {
    r.addEventListener('change', () => {
      filterState.group = r.value;
      applyGraphData();
    });
  });
  // Rel type checks
  document.querySelectorAll('.rel-check').forEach(c => {
    c.addEventListener('change', () => {
      if (c.checked) filterState.relTypes.add(c.value);
      else filterState.relTypes.delete(c.value);
      applyGraphData();
    });
  });
  // Score slider
  const slider = document.getElementById('score-slider');
  slider.addEventListener('input', () => {
    filterState.minScore = parseFloat(slider.value);
    document.getElementById('slider-val').textContent = slider.value;
    applyGraphData();
  });
  // Search
  const searchInput = document.getElementById('search-input');
  const dropdown = document.getElementById('search-dropdown');
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase().trim();
    filterState.search = q;
    if (q.length > 0) {
      const matches = [...nodeMap.keys()].filter(k => k !== 'Roy Cooper' && k.toLowerCase().includes(q));
      dropdown.innerHTML = matches.slice(0, 8).map(m =>
        `<div class="dd-item" role="option" tabindex="0" data-name="${m}">${m}</div>`
      ).join('');
      dropdown.style.display = matches.length ? 'block' : 'none';
      dropdown.querySelectorAll('.dd-item').forEach(item => {
        item.addEventListener('click', () => {
          searchInput.value = item.dataset.name;
          filterState.search = item.dataset.name.toLowerCase();
          dropdown.style.display = 'none';
          applyGraphData();
          flyToNode(item.dataset.name);
        });
      });
    } else {
      dropdown.style.display = 'none';
    }
    applyGraphData();
  });
  searchInput.addEventListener('blur', () => { setTimeout(() => { dropdown.style.display = 'none'; }, 150); });
  // Reset
  document.getElementById('reset-btn').addEventListener('click', resetFilters);
}

/* =========================================================
   CAMERA FLY-TO
   ========================================================= */
function flyToNode(name) {
  const node = graphData.nodes.find(n => n.id === name);
  if (!node) return;
  const dist = 150;
  if (is3D) {
    const { x, y, z } = node;
    Graph.cameraPosition({ x: x + dist, y: y + dist, z: z + dist }, { x, y, z }, 800);
  } else {
    Graph.centerAt(node.x, node.y, 800);
    Graph.zoom(2.5, 800);
  }
}

/* =========================================================
   SIDEBAR
   ========================================================= */
function openSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.add('open');
  sb.setAttribute('aria-hidden', 'false');
}
function closeSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.remove('open');
  sb.setAttribute('aria-hidden', 'true');
}

function colorBadge(type) {
  const c = NODE_COLORS[type] || '#94a3b8';
  return `<span class="sb-type-badge" style="background:${c}22;color:${c};border:1px solid ${c}44;">${type.replace(/_/g,' ')}</span>`;
}
function relChip(relType) {
  const c = REL_COLORS[relType] || '#94a3b8';
  return `<span class="cat-chip" style="background:${c}22;color:${c};border:1px solid ${c}44;">${relType.replace(/_/g,' ')}</span>`;
}

function openNodeSidebar(node) {
  const edges = (edgesByNode.get(node.id) || []);
  const role = ROLES[node.id] || node.role || node.type;
  let html = `
    <h2>${node.id}</h2>
    ${colorBadge(node.type)}
    <div class="sb-meta"><strong>Role:</strong> ${role}</div>
  `;
  if (node.committee_assignments) html += `<div class="sb-meta"><strong>Committees:</strong> ${node.committee_assignments}</div>`;
  if (node.term_status) html += `<div class="sb-meta"><strong>Term:</strong> ${node.term_status}</div>`;
  if (node.notes) html += `<div class="sb-meta"><strong>Notes:</strong> ${node.notes}</div>`;

  if (edges.length) {
    html += `<div class="sb-section-title">Relationships (${edges.length})</div>`;
    edges.forEach(e => {
      html += `
        <div class="sb-edge">
          ${relChip(e.relationship_type)}
          <div class="detail">${e.relationship_detail || ''}</div>
          <div class="period">${e.period || ''}</div>
          <div class="evidence">${e.evidence || ''}</div>
          <div class="score">Influence score: ${e.influence_score}</div>
          ${e.source_url ? `<a href="${e.source_url}" target="_blank" rel="noopener">Source ↗</a>` : ''}
          ${e.stance_on_aid ? `<div class="sb-meta" style="margin-top:4px;"><strong>Aid stance:</strong> ${e.stance_on_aid}</div>` : ''}
        </div>
      `;
    });
  }
  document.getElementById('sidebar-content').innerHTML = html;
  openSidebar();
}

function openEdgeSidebar(link) {
  const e = link._rawEdge;
  let html = `
    <h2>${e.node_a} → ${e.node_b}</h2>
    ${relChip(e.relationship_type)}
    <div class="sb-meta"><strong>Detail:</strong> ${e.relationship_detail || ''}</div>
    <div class="sb-meta"><strong>Period:</strong> ${e.period || ''}</div>
    <div class="sb-meta"><strong>Evidence:</strong> ${e.evidence || ''}</div>
    <div class="sb-meta"><strong>Influence Score:</strong> ${e.influence_score}</div>
    ${e.stance_on_aid ? `<div class="sb-meta"><strong>Aid stance (node_b):</strong> ${e.stance_on_aid}</div>` : ''}
    ${e.committee_assignments ? `<div class="sb-meta"><strong>Committees:</strong> ${e.committee_assignments}</div>` : ''}
    ${e.relationship_valence === 'adversarial' ? '<div class="sb-meta" style="color:#ef4444;"><strong>Adversarial relationship</strong></div>' : ''}
    ${e.source_url ? `<a href="${e.source_url}" target="_blank" rel="noopener" style="font-size:12px;color:#60a5fa;word-break:break-all;display:block;margin-top:8px;">Source ↗</a>` : ''}
  `;
  document.getElementById('sidebar-content').innerHTML = html;
  openSidebar();
}

/* =========================================================
   START HERE PANEL
   ========================================================= */
function buildStartPanel() {
  function entryHTML(item, type) {
    return `
      <button class="start-entry" data-node="${item.name}" aria-label="Focus on ${item.name}">
        <div class="en">${item.name}</div>
        <div class="er">${item.role}</div>
        <div class="es">Score: ${item.score.toFixed(1)}</div>
      </button>`;
  }
  document.getElementById('allies-list').innerHTML = allies.slice(0, 8).map(a => entryHTML(a, 'ally')).join('');
  document.getElementById('bridges-list').innerHTML = bridges.slice(0, 8).map(b => entryHTML(b, 'bridge')).join('');

  document.querySelectorAll('.start-entry').forEach(btn => {
    btn.addEventListener('click', () => {
      closeStartPanel();
      const name = btn.dataset.node;
      // Ensure node is visible
      filterState.search = '';
      document.getElementById('search-input').value = '';
      applyGraphData();
      setTimeout(() => {
        flyToNode(name);
        const node = graphData.nodes.find(n => n.id === name);
        if (node) openNodeSidebar(node);
      }, 200);
    });
  });
}

function closeStartPanel() {
  document.getElementById('start-panel').style.display = 'none';
}

/* =========================================================
   SOURCES TABLE
   ========================================================= */
let sortCol = 'node_b';
let sortDir = 1;

function buildSourcesTable() {
  renderSourcesTable();
  document.querySelectorAll('#sources-table th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      document.querySelectorAll('#sources-table th').forEach(t => t.classList.remove('sorted'));
      th.classList.add('sorted');
      th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
      renderSourcesTable();
    });
  });
}

function renderSourcesTable() {
  const rows = [...allEdges].sort((a, b) => {
    const av = a[sortCol] || '', bv = b[sortCol] || '';
    return sortDir * av.localeCompare(bv, undefined, { numeric: true });
  });
  const tbody = document.getElementById('sources-tbody');
  tbody.innerHTML = rows.map(e => `
    <tr>
      <td>${e.node_b}</td>
      <td>${e.node_b_type}</td>
      <td><span style="color:${REL_COLORS[e.relationship_type]||'#94a3b8'}">${e.relationship_type}</span></td>
      <td>${e.period}</td>
      <td style="max-width:260px;">${e.evidence}</td>
      <td>${e.influence_score}</td>
      <td>${e.source_url ? `<a href="${e.source_url}" target="_blank" rel="noopener">Link ↗</a>` : ''}</td>
    </tr>
  `).join('');
}

/* =========================================================
   HINT BANNER
   ========================================================= */
function dismissHint() {
  document.getElementById('hint-banner').style.display = 'none';
  try { localStorage.setItem('hint_dismissed', '1'); } catch(e) {}
}

function checkHint() {
  try {
    if (localStorage.getItem('hint_dismissed')) {
      document.getElementById('hint-banner').style.display = 'none';
    }
  } catch(e) {}
}

/* =========================================================
   TABS
   ========================================================= */
function switchTab(tab) {
  const mapActive = tab === 'map';
  document.getElementById('tab-map').classList.toggle('active', mapActive);
  document.getElementById('tab-sources').classList.toggle('active', !mapActive);
  document.getElementById('tab-map').setAttribute('aria-selected', mapActive);
  document.getElementById('tab-sources').setAttribute('aria-selected', !mapActive);
  document.getElementById('sources-view').style.display = mapActive ? 'none' : 'block';
  document.getElementById('graph-container').style.display = mapActive ? 'block' : 'none';
  document.getElementById('filters-panel').style.display = mapActive ? '' : 'none';
  document.getElementById('start-panel').style.display = mapActive ? '' : 'none';
  document.getElementById('dim-toggle').style.display = mapActive ? '' : 'none';
  document.getElementById('hint-banner').style.display = mapActive ? '' : 'none';
  if (!mapActive) checkHint();
}

/* =========================================================
   3D / 2D TOGGLE
   ========================================================= */
function toggleDimension() {
  is3D = !is3D;
  document.getElementById('dim-toggle').textContent = is3D ? 'Switch to 2D' : 'Switch to 3D';
  if (is3D) {
    Graph.numDimensions(3);
  } else {
    Graph.numDimensions(2);
  }
}

/* =========================================================
   KEYBOARD / ESCAPE
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSidebar();
    document.getElementById('start-panel').style.display = 'none';
  }
});

/* =========================================================
   MOBILE HAMBURGER
   ========================================================= */
document.getElementById('hamburger-btn').addEventListener('click', () => {
  const fp = document.getElementById('filters-panel');
  const open = fp.classList.toggle('mobile-open');
  document.getElementById('hamburger-btn').setAttribute('aria-expanded', open.toString());
});

/* =========================================================
   BOOT
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  // Parse data
  processData();

  // Check hint
  checkHint();

  // Wire tabs
  document.getElementById('tab-map').addEventListener('click', () => switchTab('map'));
  document.getElementById('tab-sources').addEventListener('click', () => { switchTab('sources'); buildSourcesTable(); });

  // Wire sidebar close
  document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

  // Wire 3D/2D toggle
  document.getElementById('dim-toggle').addEventListener('click', toggleDimension);

  // Wire filters
  wireFilters();

  // Build start panel
  buildStartPanel();

  // Init graph
  initGraph();

  // Verify counts in console
  console.log(`Data loaded: ${nodeMap.size} nodes (incl. Roy Cooper), ${allEdges.length} edges`);
  console.log(`Allies: ${allies.length}`, allies.map(a => a.name));
  console.log(`Bridges: ${bridges.length}`, bridges.map(b => b.name));
});
</script>
