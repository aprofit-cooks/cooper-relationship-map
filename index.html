// ============================================================
// BUILD GRAPH DATA
// ============================================================
const nodeMap = {};
const edgeList = [];
const bridgeNodes = new Set();

// Collect all nodes
EDGES_RAW.forEach(e => {
  const addNode = (name, type) => {
    if (!nodeMap[name]) {
      nodeMap[name] = { id: name, type: type, degree: 0, networks: new Set(), isSitting: false, edges: [] };
    }
    nodeMap[name].networks.add(e.candidate_network);
    if (e.is_sitting_member === 'True') nodeMap[name].isSitting = true;
  };
  addNode(e.node_a, e.node_a_type);
  addNode(e.node_b, e.node_b_type);
});

// Build edges
EDGES_RAW.forEach((e, i) => {
  nodeMap[e.node_a].degree++;
  nodeMap[e.node_b].degree++;
  nodeMap[e.node_a].edges.push(e);
  nodeMap[e.node_b].edges.push(e);
  edgeList.push({
    source: e.node_a,
    target: e.node_b,
    relationship_type: e.relationship_type,
    relationship_detail: e.relationship_detail,
    period: e.period,
    evidence: e.evidence,
    source_url: e.source_url,
    candidate_network: e.candidate_network,
    is_sitting_member: e.is_sitting_member,
    idx: i
  });
});

// Identify bridge nodes
Object.values(nodeMap).forEach(n => {
  if (n.networks.has('Cooper') && n.networks.has('Whatley')) {
    bridgeNodes.add(n.id);
  }
  n.isBridge = bridgeNodes.has(n.id);
});

// Handle multi-edges between same pair: assign curvature
const pairCount = {};
edgeList.forEach(e => {
  const key = [e.source, e.target].sort().join('|||');
  pairCount[key] = (pairCount[key] || 0) + 1;
});
const pairIdx = {};
edgeList.forEach(e => {
  const key = [e.source, e.target].sort().join('|||');
  pairIdx[key] = (pairIdx[key] || 0) + 1;
  const total = pairCount[key];
  if (total > 1) {
    e.curvature = 0.15 + (pairIdx[key] - 1) * 0.15;
  } else {
    e.curvature = 0.2;
  }
});

function getNodeColor(node) {
  if (CANDIDATE_COLORS[node.id]) return CANDIDATE_COLORS[node.id];
  return NODE_TYPE_COLORS[node.type] || '#94a3b8';
}

function getNodeSize(node) {
  if (node.type === 'candidate') return 12;
  return 3 + Math.min(node.degree * 1.5, 8);
}

// ============================================================
// BUILD GRAPH
// ============================================================
const allNodes = Object.values(nodeMap);
let graphData = { nodes: allNodes, links: edgeList };

let currentMode = '3d';
let graph;

function initGraph() {
  const container = document.getElementById('graph-container');
  container.innerHTML = '';

  graph = ForceGraph3D()(container)
    .graphData(JSON.parse(JSON.stringify(graphData)))
    .backgroundColor('#0a0e27')
    .nodeLabel(() => '')
    .nodeVal(n => getNodeSize(n))
    .nodeColor(n => getNodeColor(n))
    .nodeOpacity(1)
    .nodeResolution(16)
    .linkColor(l => {
      const c = REL_TYPE_COLORS[l.relationship_type] || '#94a3b8';
      return c + '66'; // alpha
    })
    .linkWidth(1.2)
    .linkCurvature(l => l.curvature || 0.2)
    .linkOpacity(0.4)
    .linkDirectionalParticles(0)
    .d3AlphaDecay(0.02)
    .d3VelocityDecay(0.3)
    .warmupTicks(80)
    .cooldownTicks(200)
    .onNodeHover(handleNodeHover)
    .onNodeClick(handleNodeClick)
    .nodeThreeObject(n => {
      const group = new THREE.Group();
      const color = getNodeColor(n);
      const size = getNodeSize(n);

      // Main sphere
      const geometry = new THREE.SphereGeometry(size, 16, 16);
      const material = new THREE.MeshPhongMaterial({
        color: new THREE.Color(color),
        emissive: new THREE.Color(color),
        emissiveIntensity: 0.4,
        transparent: true,
        opacity: 0.9
      });
      const sphere = new THREE.Mesh(geometry, material);
      group.add(sphere);

      // Glow for candidates
      if (n.type === 'candidate') {
        const glowGeom = new THREE.SphereGeometry(size * 1.6, 16, 16);
        const glowMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(color),
          transparent: true,
          opacity: 0.15
        });
        const glow = new THREE.Mesh(glowGeom, glowMat);
        group.add(glow);
      }

      // Sitting member ring
      if (n.isSitting && n.type !== 'candidate') {
        const ringGeom = new THREE.RingGeometry(size * 1.3, size * 1.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.7,
          side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        group.add(ring);
      }

      // Bridge node ring
      if (n.isBridge && n.type !== 'candidate') {
        const ringGeom = new THREE.RingGeometry(size * 1.6, size * 1.8, 32);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        group.add(ring);
      }

      // Label sprite
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 256;
      canvas.height = 64;
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, 256, 64);
      ctx.font = '600 24px Inter, sans-serif';
      ctx.fillStyle = '#e2e8f0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Truncate long names
      let label = n.id;
      if (label.length > 20) label = label.substring(0, 18) + '...';
      ctx.fillText(label, 128, 32);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        opacity: 0.85
      });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(size * 4, size * 1, 1);
      sprite.position.set(0, size * 1.8, 0);
      group.add(sprite);

      return group;
    });

  // Add ambient light
  const scene = graph.scene();
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 0.8, 1000);
  pointLight.position.set(200, 200, 200);
  scene.add(pointLight);

  applyFilters();
}

// TOOLTIP
// ============================================================
function handleNodeHover(node, prevNode) {
  const tooltip = document.getElementById('tooltip');
  if (!node) {
    tooltip.style.display = 'none';
    document.body.style.cursor = 'default';
    return;
  }
  document.body.style.cursor = 'pointer';
  tooltip.style.display = 'block';

  const color = getNodeColor(node);
  let infoHtml = '';
  if (node.isBridge) infoHtml += '<div class="tt-info" style="color:#fbbf24">Bridge node (both networks)</div>';
  if (node.isSitting) infoHtml += '<div class="tt-info">Sitting member</div>';
  infoHtml += `<div class="tt-info">Connections: ${node.degree}</div>`;

  tooltip.innerHTML = `
    <div class="tt-name" style="color:${color}">${node.id}</div>
    <div class="tt-type">${NODE_TYPE_LABELS[node.type] || node.type}</div>
    ${infoHtml}
  `;

  // Position near mouse
  const evt = graph.renderer().domElement;
  document.addEventListener('mousemove', positionTooltip);
}

function positionTooltip(e) {
  const tooltip = document.getElementById('tooltip');
  if (tooltip.style.display === 'none') return;
  let x = e.clientX + 16;
  let y = e.clientY + 16;
  if (x + 280 > window.innerWidth) x = e.clientX - 290;
  if (y + 150 > window.innerHeight) y = e.clientY - 160;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}

  if (!node) return;

  const color = getNodeColor(node);
  const nodeData = nodeMap[node.id];

  let edgesHtml = '';

    const other = e.node_a === node.id ? e.node_b : e.node_a;

      <div class="sp-edge">

  const networkList = Array.from(nodeData.networks).join(', ');

  body.innerHTML = `
    <div class="sp-name" style="color:${color}">${node.id}</div>
    <div class="sp-type">${NODE_TYPE_LABELS[node.type] || node.type}</div>
    <div style="margin-bottom:12px">${badges}</div>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:16px">Networks: ${networkList} | Connections: ${nodeData.degree}</div>
    <h4 style="font-size:13px;font-weight:700;margin-bottom:10px;color:#f1f5f9">Relationships (${nodeData.edges.length})</h4>
    ${edgesHtml}
  `;

  panel.classList.add('open');
}

function closeSidePanel() {
  document.getElementById('side-panel').classList.remove('open');
}

// ============================================================
// FILTERS
// ============================================================
function applyFilters() {
  const showCooper = document.getElementById('f-cooper').checked;
  const showWhatley = document.getElementById('f-whatley').checked;
  const sittingOnly = document.getElementById('f-sitting').checked;
  const bridgeOnly = document.getElementById('f-bridge').checked;

  // Get checked relationship types
  const checkedRelTypes = new Set();
  document.querySelectorAll('#rel-type-filters input[type=checkbox]').forEach(cb => {
    if (cb.checked) checkedRelTypes.add(cb.dataset.val);
  });

  // Get checked node types
  const checkedNodeTypes = new Set();
  document.querySelectorAll('#node-type-filters input[type=checkbox]').forEach(cb => {
    if (cb.checked) checkedNodeTypes.add(cb.dataset.val);
  });

  // Filter edges
  const filteredEdges = edgeList.filter(e => {
    // Network filter
    if (!showCooper && e.candidate_network === 'Cooper') return false;
    if (!showWhatley && e.candidate_network === 'Whatley') return false;
    // Relationship type filter
    if (!checkedRelTypes.has(e.relationship_type)) return false;
    return true;
  });

  // Get nodes referenced by filtered edges
  const activeNodeIds = new Set();
  filteredEdges.forEach(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    activeNodeIds.add(srcId);
    activeNodeIds.add(tgtId);
  });

  // Filter nodes
  const filteredNodes = allNodes.filter(n => {
    if (!activeNodeIds.has(n.id)) return false;
    if (!checkedNodeTypes.has(n.type)) return false;
    if (sittingOnly && !n.isSitting) return false;
    if (bridgeOnly && !n.isBridge) return false;
    return true;
  });

  // Further filter edges to only include edges where both endpoints are visible
  const visibleNodeIds = new Set(filteredNodes.map(n => n.id));
  const finalEdges = filteredEdges.filter(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    return visibleNodeIds.has(srcId) && visibleNodeIds.has(tgtId);
  });

  graph.graphData({
    nodes: filteredNodes,
    links: finalEdges
  });

  updateStats(filteredNodes, finalEdges);
}

function onSearch(query) {
  const resultsDiv = document.getElementById('search-results');
  if (!query.trim()) {
    resultsDiv.innerHTML = '';
    return;
  }
  const q = query.toLowerCase();
  const matches = allNodes.filter(n => n.id.toLowerCase().includes(q)).slice(0, 8);
  resultsDiv.innerHTML = matches.map(n => {
    const color = getNodeColor(n);
    return `<div class="search-result" onclick="flyToNode('${n.id.replace(/'/g, "\\'")}')" style="color:${color}">${n.id} <span style="color:#64748b;font-size:10px">${n.type}</span></div>`;
  }).join('');
}

function flyToNode(nodeId) {
  const node = graph.graphData().nodes.find(n => n.id === nodeId);
  if (!node) return;
  const distance = 120;
  const distRatio = 1 + distance / Math.hypot(node.x || 0, node.y || 0, node.z || 0);
  graph.cameraPosition(
    { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
    { x: node.x || 0, y: node.y || 0, z: node.z || 0 },
    1500
  );
  document.getElementById('search-results').innerHTML = '';
  document.getElementById('search-box').value = '';
  // Trigger click on the node
  setTimeout(() => handleNodeClick(node), 1600);
}

// ============================================================
// STATS
// ============================================================
function updateStats(nodes, edges) {
  const container = document.getElementById('stats-content');
  const cooperEdges = edges.filter(e => e.candidate_network === 'Cooper');
  const whatleyEdges = edges.filter(e => e.candidate_network === 'Whatley');

  // Category breakdown
  const catCountCooper = {};
  const catCountWhatley = {};
  cooperEdges.forEach(e => { catCountCooper[e.relationship_type] = (catCountCooper[e.relationship_type] || 0) + 1; });
  whatleyEdges.forEach(e => { catCountWhatley[e.relationship_type] = (catCountWhatley[e.relationship_type] || 0) + 1; });

  let catHtml = '';
  Object.keys(REL_TYPE_COLORS).forEach(rt => {
    const cc = catCountCooper[rt] || 0;
    const wc = catCountWhatley[rt] || 0;
    if (cc + wc > 0) {
      catHtml += `<div class="stat-row stat-sub"><span class="stat-label" style="color:${REL_TYPE_COLORS[rt]}">${REL_TYPE_LABELS[rt] || rt}</span><span class="stat-value">${cc}C / ${wc}W</span></div>`;
    }
  });

  container.innerHTML = `
    <div class="stat-row"><span class="stat-label">Visible nodes</span><span class="stat-value">${nodes.length}</span></div>
    <div class="stat-row"><span class="stat-label">Visible edges</span><span class="stat-value">${edges.length}</span></div>
    <div class="stat-row"><span class="stat-label" style="color:#3b82f6">Cooper edges</span><span class="stat-value">${cooperEdges.length}</span></div>
    <div class="stat-row"><span class="stat-label" style="color:#ef4444">Whatley edges</span><span class="stat-value">${whatleyEdges.length}</span></div>
    <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(100,116,139,0.15)">
      <div style="font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:4px">BY CATEGORY (C/W)</div>
      ${catHtml}
    </div>
  `;
}

// ============================================================
// VIEW TOGGLE
// ============================================================
function setView(mode) {
  currentMode = mode;
  document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
  document.getElementById('btn-2d').classList.toggle('active', mode === '2d');

  if (mode === '2d') {
    graph.numDimensions(2);
    // Move camera to top-down
    graph.cameraPosition({ x: 0, y: 0, z: 600 }, { x: 0, y: 0, z: 0 }, 1000);
  } else {
    graph.numDimensions(3);
    graph.cameraPosition({ x: 0, y: 0, z: 400 }, { x: 0, y: 0, z: 0 }, 1000);
  }
}

// ============================================================
// EXPORT PNG
// ============================================================
function exportPNG() {
  const renderer = graph.renderer();
  renderer.render(graph.scene(), graph.camera());
  const dataUrl = renderer.domElement.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = 'nc_senate_2026_network.png';
  a.click();
}

// ============================================================
// BUILD FILTER UI
// ============================================================
function buildFilters() {
  // Relationship type checkboxes
  const relDiv = document.getElementById('rel-type-filters');
  Object.keys(REL_TYPE_COLORS).forEach(rt => {
    const color = REL_TYPE_COLORS[rt];
    relDiv.innerHTML += `
      <div class="filter-row">
        <input type="checkbox" checked data-val="${rt}" onchange="applyFilters()">
        <span class="color-dot" style="background:${color}"></span>
        <span>${REL_TYPE_LABELS[rt] || rt}</span>
      </div>
    `;
  });

  // Node type checkboxes
  const nodeDiv = document.getElementById('node-type-filters');
  Object.keys(NODE_TYPE_COLORS).forEach(nt => {
    const color = nt === 'candidate' ? '#888' : NODE_TYPE_COLORS[nt];
    nodeDiv.innerHTML += `
      <div class="filter-row">
        <input type="checkbox" checked data-val="${nt}" onchange="applyFilters()">
        <span class="color-dot" style="background:${color}"></span>
        <span>${NODE_TYPE_LABELS[nt] || nt}</span>
      </div>
    `;
  });

  // Node legend
  const nodeLegend = document.getElementById('node-legend');
  nodeLegend.innerHTML += `<div class="legend-item"><span class="color-dot" style="background:#3b82f6;box-shadow:0 0 6px #3b82f6"></span> Cooper (candidate)</div>`;
  nodeLegend.innerHTML += `<div class="legend-item"><span class="color-dot" style="background:#ef4444;box-shadow:0 0 6px #ef4444"></span> Whatley (candidate)</div>`;
  Object.keys(NODE_TYPE_COLORS).forEach(nt => {
    if (nt === 'candidate') return;
    nodeLegend.innerHTML += `<div class="legend-item"><span class="color-dot" style="background:${NODE_TYPE_COLORS[nt]}"></span> ${NODE_TYPE_LABELS[nt]}</div>`;
  });

  // Edge legend
  const edgeLegend = document.getElementById('edge-legend');
  Object.keys(REL_TYPE_COLORS).forEach(rt => {
    edgeLegend.innerHTML += `<div class="legend-item"><span class="legend-line" style="background:${REL_TYPE_COLORS[rt]}"></span> ${REL_TYPE_LABELS[rt]}</div>`;
  });
}

// ============================================================
// INIT
// ============================================================
buildFilters();
initGraph();
</script>
